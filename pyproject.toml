[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcvault"
version = "1.0.0"
description = "Export, preserve, search, recover and organize your Arc browser library."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ArcVault contributors" }]
keywords = ["arc", "browser", "bookmarks", "export", "tabs", "knowledge-base"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: Utilities",
]
dependencies = ["typer>=0.12", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
arcvault = "arcvault.cli:main"

[project.urls]
Homepage = "https://github.com/lexdumitrache/arcvault"
Issues = "https://github.com/lexdumitrache/arcvault/issues"
Changelog = "https://github.com/lexdumitrache/arcvault/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/arcvault"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "E501", "RUF001", "RUF002", "RUF003"]  # line length is the formatter's job

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/arcvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
