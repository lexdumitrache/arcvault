name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]" build
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -q
      - name: Build
        run: python -m build
